<div class="container">
  <h1 class="title">
    {{ 'PAGES.HOME.TITLE' | translate }}
  </h1>
  <mat-label>Favorite food</mat-label>
  <mat-select>
    @for (sp of serialPorts; track sp) {
      <mat-option [value]="sp.value">{{sp.viewValue}}</mat-option>
    }
  </mat-select>
  <a (click)="listSerialPorts()">Scan serial ports</a>

</div>
