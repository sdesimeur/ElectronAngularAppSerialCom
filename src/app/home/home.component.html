<div class="container">
  <h1 class="title">
    {{ 'PAGES.HOME.TITLE' | translate }}
  </h1>
  <div>
    <form>
  <select [(ngModel)]="serialPortId" [ngModelOptions]="{standalone: true}">
    <option *ngFor="let sp of serialPorts; index as id" [ngValue]="id">{{sp.path}}</option>
  </select>
  </form>
  </div>
  <a (click)="listSerialPorts()">Connect to selected serial port</a>

</div>
